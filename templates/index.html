<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance ML App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #4f46e5, #9333ea);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            font-weight: 800;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
            opacity: 0.9;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: white;
            color: #4f46e5;
            font-weight: bold;
            font-size: 16px;
            border-radius: 10px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #f3f4f6;
        }

        .card {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Performance Predictor</h1>

    <p>
        A Machine Learning Web App that predicts a student's Maths score based on
        gender, ethnicity, parental education, and exam preparation.
    </p>

    <a href="{{ url_for('predict_datapoint') }}" class="btn">
        Start Prediction
    </a>

    <div class="card">
        <p>
            Built using Flask + Machine Learning Pipeline <br>
            Model predicts student academic performance intelligently
        </p>
    </div>

</div>

</body>
</html>
